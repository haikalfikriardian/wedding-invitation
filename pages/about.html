  .modal-content {

  }

  .modal-content .close {
    background: #F2EAE1 !important;
    color: #5A5046 !important;
    border: 1px solid #EAE0D6 !important;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03) !important;
    width: 32px !important;
    height: 32px !important;
    border-radius: 50% !important;
    transition: 0.2s !important;
  }

  .modal-content .close:hover {
    background: #E5D9CC !important;
    transform: none !important;
  }

  .about-wrapper {
    font-family: 'Cormorant Garamond', serif;
    text-align: center;
    padding: 10px 4px 20px;
    color: #3A332C;
  }

  /* TITLE */
  .about-wrapper .about-title {
    font-size: 34px;
    font-weight: 600;
    color: #3A332C;
    margin: 0 0 8px;
    letter-spacing: 0.5px;
  }

  .about-wrapper .about-title-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 0 auto 10px;
  }

  .about-wrapper .about-title-divider::before,
  .about-wrapper .about-title-divider::after {
    content: '';
    display: block;
    width: 40px;
    height: 1.5px;
    background: #D8C7B5;
  }

  .about-wrapper .about-title-divider svg {
    color: #A36F5A;
  }

  .about-wrapper .about-subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 14px;
    color: #8C6A5A;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin: 0 0 24px !important;
  }

  /* COUPLE */
  .about-wrapper .about-couple {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 24px;
  }

  .about-wrapper .person {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .about-wrapper .person-photo-wrap {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    padding: 4px;
    background: #fff;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
    flex-shrink: 0;
  }

  .about-wrapper .person img {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover;
    border-radius: 50%;
    display: block;
  }

  .about-wrapper .person p {
    font-size: 18px !important;
    font-weight: 600 !important;
    color: #3A332C !important;
    margin: 0 !important;
  }

  .about-wrapper .person-ornament {
    color: #C4927C;
    width: 44px;
  }

  .about-wrapper .love-icon-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 42px;
  }

  .about-wrapper .love-icon-dots {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #B88673;
    opacity: 0.6;
  }

  .about-wrapper .love-icon-svg {
    color: #C4342E;
    animation: ab-hb 2s ease-in-out infinite;
  }

  @keyframes ab-hb {

    0%,
    100% {
      transform: scale(1)
    }

    30% {
      transform: scale(1.15)
    }

    60% {
      transform: scale(1.05)
    }
  }

  /* TIMELINE SECTION */
  .about-wrapper .timeline-section {
    background: #FAF4EC;
    border: 1px solid #EBE1D5;
    border-radius: 16px;
    padding: 24px 16px 20px;
    margin: 0 auto 24px;
    box-shadow: inset 0 0 0 1px #FAF4EC, 0 4px 16px rgba(0, 0, 0, 0.02);
  }

  .about-wrapper .timeline-heading {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 24px;
  }

  .about-wrapper .timeline-heading-title {
    font-size: 18px;
    font-weight: 600;
    color: #A36F5A;
    margin: 0;
  }

  .about-wrapper .timeline-heading svg {
    color: #C4927C;
  }

  .about-wrapper .timeline-list {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 0;
    margin: 0;
  }

  .about-wrapper .timeline-line {
    position: absolute;
    left: 20px;
    top: 24px;
    bottom: 24px;
    width: 2px;
    background-image: repeating-linear-gradient(to bottom, #D5C2B3 0, #D5C2B3 4px, transparent 4px, transparent 8px);

    z-index: 0;
  }

  /* ICON & CARD */
  .about-wrapper .tl-row {
    position: relative;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 16px;
    width: 100%;
  }

  .about-wrapper .tl-icon {
    width: 42px;
    height: 42px;
    min-width: 42px;
    border-radius: 50%;
    background: #fff;
    border: 1.5px solid #D5C2B3;
    box-shadow: 0 4px 10px rgba(163, 111, 90, 0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    z-index: 1;
    color: #A36F5A;
  }

  .about-wrapper .tl-card {
    flex: 1;
    background: #fff;
    border: 1px solid #F0E8DF;
    border-radius: 12px;
    padding: 14px 16px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: transform 0.25s, box-shadow 0.25s;
  }

  .about-wrapper .tl-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(163, 111, 90, 0.12);
  }

  .about-wrapper .tl-text {
    display: flex;
    flex-direction: column;
    gap: 4px;
    text-align: left;
  }

  .about-wrapper .tl-year {
    font-size: 14px !important;
    font-weight: 700 !important;
    color: #A36F5A !important;
    display: block !important;
    line-height: 1;
  }

  .about-wrapper .tl-event {
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px !important;
    font-weight: 600 !important;
    color: #3A332C !important;
    margin: 0 !important;
    line-height: 1.2;
  }

  .about-wrapper .tl-heart {
    flex-shrink: 0;
    color: #D5C2B3;
    margin-left: 8px;
  }

  /* QUOTE */
  .about-wrapper .about-quote-wrap {
    background: #FDFBFA;
    border: 1px solid #EBE1D5;
    border-radius: 12px;
    padding: 24px 24px 16px;
    margin-top: 24px;
    text-align: center;
    position: relative;
  }

  .about-wrapper .about-quote-mark {
    position: absolute;
    top: 8px;
    left: 12px;
    color: #EAE0D6;
    opacity: 0.8;
  }

  .about-wrapper .about-quote-mark-right {
    position: absolute;
    bottom: 8px;
    right: 12px;
    color: #EAE0D6;
    transform: rotate(180deg);
    opacity: 0.8;
  }

  .about-wrapper .about-quote-text {
    font-family: 'Cormorant Garamond', serif !important;
    font-style: italic !important;
    font-size: 16px !important;
    line-height: 1.5 !important;

    margin: 0 0 12px !important;

    z-index: 1;
  }

  .about-wrapper .about-quote-heart {

    justify-content: center;
    color: #B88673;
  }

  /* BUTTON */
  .about-wrapper .read-story-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 32px auto 0;

  }

  .about-wrapper .read-story-btn:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 8px 24px rgba(163, 111, 90, 0.4);
  }

  .about-wrapper .read-story-btn:active {
    transform: scale(0.96);
  }
</style>
